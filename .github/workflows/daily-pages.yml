# Daily public update of https://tradermonty.github.io/ftd-dd-dashboard/.
# Runs scripts/publish_pages.sh: fresh FMP fetch, validated build, replay, page check, then a
# push to gh-pages. FMP data lives only inside the runner; nothing is cached or uploaded.
name: daily pages

on:
  schedule:
    # 23:30 UTC = 18:30 EST (winter) / 19:30 EDT (summer), after the US close, Mon-Fri
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -e . playwright
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Publish
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PAGES_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: ./scripts/publish_pages.sh

      - name: Show logs
        if: always()
        run: tail -n 80 logs/*.log 2>/dev/null || true
