  f_ov_variants: "R2: all variants, design period, by borrow-cost case"
  f_ov_test: "R2: buy and hold and picked variant, test period"
  f_ov_selected: "R2: periods, pick rule, picked variant and its levered periods"
  ov_cost_dff: "DFF + {spread}"
  ov_cost_fixed: "fixed {rate}"
  ov_contam_h: "The test period had been seen in a preview"
  ov_contam_lead: "On {date}, before R2 was designed, the project owner ran a one-off preview over the whole of {y0} to {y1}: enter only when the risk level was not HIGH or SEVERE, exposure {lev}, borrow rate {rate} a year, go back to 100% when the risk level was SEVERE. It was levered on {share_lo} to {share_hi} of the days."
  ov_contam_same: "the same"
  ov_contam_effect: "The preview showed that the entry condition left few chances to enter. R2 therefore returns to 100% on the number of DDs counted after the FTD instead of on the risk level. R2's design was decided after the test period had been seen."
  ov_contam_verdict: "The grid of variants was decided and written in docs/plan.md before R2's own computations, but the test period had already been seen. R2's test-period result is therefore not a clean out-of-sample test."
  ov_forward_h: "Forward record"
  ov_forward_note: "Data through {after} was seen in the preview and in R2's design. Sessions after that date have not been seen by anyone. The table below shows buy and hold and the picked variant over the sessions after {after}, computed with the same code as the rest."
  ov_forward_none: "not started"
  ov_design: "{idx}: in the design period the picked variant earned a CAGR of {cagr}, {w} the {bh_cagr} of buy and hold. Its max drawdown was {dd} against {bh_dd} for buy and hold."
  ov_design_rule: "The pick rule takes the highest design-period CAGR among the variants whose design-period max drawdown is not worse than that of buy and hold by more than {pp} percentage points. It does not require the variant to beat buy and hold on CAGR, so a variant with a lower CAGR than buy and hold can be picked."
  ov_design_worse: "For {idx} that is what happened: the picked variant's design-period CAGR is lower than that of buy and hold."
  ov_design_margin: "{idx}: the limit is {limit}, which is {pp} percentage points worse than the {bh_dd} max drawdown of buy and hold. The picked variant's design-period max drawdown of {dd} passed with a margin of {margin} points."
  ov_design_narrow: "The margin is very small, and a slightly different limit could have picked another variant."
  ov_tie_none: "The R2 tie rule had no effect on the picks, because no variants tied exactly on the design-period CAGR for either index."
  ov_tie_item: "R2 tie rule: for {idx}, {n} variants tied exactly at the top design-period CAGR, and the pick {changed}."
  ov_changed: "changed"
  ov_unchanged: "did not change"
  ov_m_rate_amend: "Post-hoc change ({date}): the borrow-rate timing was corrected. It used to take the DFF dated up to the previous session. FRED publishes each day's value on the next business day, so that was a value not yet published at the previous close. The rate now taken is the one dated up to the session before the previous one."
  ov_m_rate_item: "Effect of the rate-timing change, {idx}: the picked variant's CAGR in the design period {design}, and in the test period {test}. The pick {same}."
  ov_key: "R2, adding leverage after an FTD: {items} This test period had been seen in a preview before R2 was designed, so it is not a clean out-of-sample check. Sessions after {after} are the period nobody has seen yet. This is research, not a trading recommendation."
  ov_key_item: "For {idx}, in the test period the picked variant earned {cagr} against {bh_cagr} for buy and hold, with a max drawdown of {dd} against {bh_dd}. In the design period its CAGR was {d_cagr}, {d_w} the {d_bh_cagr} of buy and hold, and its max drawdown of {d_dd} passed the limit of {limit} with a margin of {margin} points.{narrow}"
  ov_key_item_same: "For {idx} the picked variant is buy and hold itself."
  k_a_dropped: "{n} of them did not become a trade, because the {h} sessions after the buy run past the end of the test period."
  k_a_skipped: "{n} of them did not become a trade, because the FTD was already invalidated when it was detected."
  k_a_overlap: "Of the {n} FTDs detected, {k} have another FTD of the same index within {h} sessions before or after, so their holding periods overlap. One unit of capital could not hold them all, so the trade count and the profits include the overlap."
  freeze_head: "The variant grid was written in docs/plan.md before the computations. The hash file that freezes it was made later, at {ts} in UTC. The registration date {date} is the local Pacific date; at UTC-8 the freeze time falls on {local}. {utc_note}"
  freeze_utc_next: "In UTC the date is already the next day, so the date of the time in the file is one day after the registration date."
  freeze_prov_none: "No earlier runs made before the freeze were found."
  freeze_prov: "Before the freeze, {n} runs had been made, the first being {first}. Their {file} files {state}. The output of this run {this}."
  prov_bytes_same: "are identical byte for byte, with a sha256 starting {sha}"
  prov_rows_same: "have identical data rows; only the header line differs"
  prov_diff: "are not all identical"
  prov_this_same: "has the same data rows as they do"
  prov_this_diff: "differs from them"
  h_forward: "Forward record for R"
  forward_note: "The end of the test period is fixed at {after}; it is not the latest session of the data. Later sessions are kept out of the test period and appear only in these tables. They show the baseline and the picked variants over the sessions after {after}, computed with the same code as the test period. Until there is data, they read \"not started\"."
  r_contam_h: "Whole-period statistics had been seen before R was designed"
  r_contam_lead: "On {date}, before R was designed, the background section of docs/plan.md was written from statistics over the whole of {y0} to {y1}. That period includes the test period, from {test_start}. The statistics were the share of days that were DDs and how the later share of large falls differs between NORMAL and SEVERE days. The figures are in the table below."
  r_contam_ftd: "The background section of docs/plan.md also says that the 60-session returns after an FTD, over the same whole period, had a median no different from all days and a wide spread."
  r_contam_effect: "What R tests was decided after these statistics had been seen. R's test-period result is therefore not a clean out-of-sample check either."
  r_contam_verdict: "That makes three exceptions where the test period had been seen: the tie rule, the R2 preview, and these whole-period statistics."
  ov_rate_changed: "went from {before} to {after}"
  ov_rate_same: "stayed at {value}"
  ov_key_narrow: " The margin is very small, so a slightly different limit could have picked another variant."
