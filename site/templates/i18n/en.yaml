def:
  title: "Definitions"
  lead: "The judgments on this site are the claude-trading-skills code vendored into this project. The figures below are read from that code and its settings."
  not_ibd_box: "These are not IBD's official FTD or DD calls. IBD's reading of the market is a human judgment; this site applies the skill's mechanical definitions to the past."
  h_ftd: "How an FTD is judged"
  ftd_swing: "Prior decline: a swing low after a fall of {pct}% or more from a recent high, with at least {days} down days. The reference high is searched up to {back} bars back."
  ftd_day1: "Rally day 1: the first day after the swing low that closes up on the previous day, or closes in the top half of its own day's range. A close below the swing-low close at any point resets the rally attempt. On days 2 and 3 the close must not fall below the day-1 intraday low."
  ftd_window: "FTD: on rally day {a} to {b}, a gain of at least {gain}% on volume above the previous day."
  ftd_gain_grades: "Gains of {rec}% or more are rated recommended and {strong}% or more strong. The minimum is what the judgment uses."
  ftd_bars: "Window: the state is judged on the last {analysis} bars only; the replay passes {fetch} bars each day."
  ftd_invalid: "Invalidation: a close below the FTD-day low. This site counts invalidations within {h} sessions of the FTD."
  h_dd: "How a Distribution Day is judged"
  dd_rule: "DD: a change of {decline}% or lower from the previous close, on volume above the previous day."
  dd_expire: "Expiry: the DD day counts as 0 and the DD drops out when the age exceeds {n}, that is on the {m}th session."
  dd_invalid: "Invalidation: a DD drops out before expiry if the {src} rises {gain}% above the DD-day close."
  src_high: "intraday high"
  src_close: "close"
  dd_counts: "d5, d15 and d25 count the active DDs among today plus the previous 5, 15 and 25 sessions. For example d25 covers 26 sessions: today and the 25 before it."
  h_levels: "Risk levels"
  lv_caution: "d25 of {c25} or more"
  lv_high: "any of d25 {h25} or more, d15 {h15} or more, d5 {h5} or more"
  lv_severe: "d25 of {s25} or more, or d15 of {s15} or more; or the close below both the {ema}-day EMA and the {sma}-day SMA with d25 of {sm} or more"
  lv_normal: "none of the above"
  source_note: "Source: rally_tracker.py and post_ftd_monitor.py in vendor/ftd_detector; models.py and risk_classifier.py in vendor/ibd_dd. The counting follows ibd_monitor.py."
  h_ibd: "How this differs from IBD in practice"
  ibd_correction: "IBD decides by human judgment whether the market is in a correction. This skill decides mechanically with the prior-decline definition above."
  ibd_gain: "The gain needed for an FTD differs between sources. The skill's minimum is given above."
  ibd_dd: "The decline threshold and the expiry rule for DDs also vary in detail between IBD articles. This site fixes them to the definition above."
  ibd_index: "IBD watches the S&P 500 and the Nasdaq Composite. This site uses ^GSPC and ^IXIC, but the skills take different inputs: the FTD skill uses ^GSPC and QQQ, and the DD skill defaults to QQQ and SPY. QQQ is an ETF that tracks the Nasdaq-100, a different basket from the Nasdaq Composite, and its share volume is not the index volume. Both rules use volume, so the same day can be judged differently."
  ibd_freq: "With this definition, {n_ftd} FTDs were found across the two indices between {first} and {last}. They were not checked against IBD's own list."
  h_base: "Base rate"
  base_intro: "A DD is not a rare day. For each index, this shows the share of all sessions that were DDs and the expected number per {win}-session d25 window."
  base_item: "{idx}: {dd} of {n} sessions were DDs, a share of {share}. That is {exp} per {win} sessions on average, and the average active DD count d25 was {mean}. d25 of {s25} or more held on {share_sev} of sessions. SEVERE is also reached by d15 of {s15} or more, or by a close below both moving averages with d25 of {sm} or more. The risk level was SEVERE on {lv_sev} of sessions and NORMAL on {lv_norm}. There were {sev_days} SEVERE days, and {share_not} of them were SEVERE through another condition, with d25 below {s25}."
  base_why: "This share is the base rate. If a risk threshold sits close to this level, that level is not a rare warning; it only says the DD count is as high as usual. Compare a risk level with these shares before treating it as a signal."
  h_pit: "Detection date and point-in-time judgment"
  pit_replay: "Every day's judgment uses only data up to that day. The last {n} bars go to the FTD logic and the last {m} bars to the DD logic, and everything is recomputed from scratch each day."
  pit_detected: "ftd_date is the day designated as the FTD; detected_on is the first day of the replay on which that FTD was visible. If the window moves and an FTD appears later, the two dates differ."
  pit_lag: "In this replay the largest gap between ftd_date and detected_on was {max_lag} sessions, across {n} FTDs."
  pit_outcome: "Returns afterwards are measured from the detected_on close. Measuring from ftd_date would use information that was not yet visible. The return measured from ftd_date is kept in separate columns for reference."
  pit_start: "The replay starts on {first}. FTDs dated before that cannot be detected point in time, so they are left out of the list."
  h_data_issues: "Data notes"
  data_issues: "Rows with zero or missing volume and rows with the same volume as the previous day are kept and only recorded in data_issues.csv. This run has {n} such rows. On a day with the same volume as the previous day, the condition volume above the previous day cannot hold."
