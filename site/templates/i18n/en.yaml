research:
  title: "Research: checking FTD and DD with numbers"
  lead: "FTDs and Distribution Days are talked about as hints for market bottoms and tops. Here the skill's own definition is the baseline, and it is compared with variants of the conditions to see what can actually be said in numbers."
  caveat_short: "Many variants were tried, so the picked ones look good by construction. Samples are small, price indices exclude dividends, and the exposure comparison earns 0% on cash. Read the caveats section first."
  h_conclusions: "Key points"
  conclusions_note: "The test period was not used to pick conditions, with three exceptions. First, the tie rule was defined after the test results had been seen. Second, R2's test period had been previewed before R2 was designed. Third, research R was designed after statistics over the whole of 2000 to 2026, which include the test period, had been looked at when its background section was written. They are described under post-hoc changes and in the boxes for R and R2. The baseline's design-period rows were candidates in the selection, so they are not numbers the selection left untouched. What sets the baseline apart from a pick is that it is the skill's own definition and was not chosen from results."
  h_method: "Fixed rules of the check"
  h_variants: "Variants tried"
  h_a: "A. FTD as a trade"
  h_b: "B. Cutting exposure on DD risk"
  h_c: "C. Frequency of large falls by risk level"
  h_blocks: "Forward returns by DD count and risk level"
  h_blocks_dd: "By active DD count"
  h_blocks_risk: "By risk level"
  h_ftd_out: "Returns after FTDs"
  h_caveats: "Caveats"
  h_files: "Source numbers"
  k_variants: "{n_total} variants were tried: {n_ftd} for FTD and {n_dd} for DD. All were scored on the design period {d0} to {d1}. Only the baseline and the picked variant were scored, once, on the test period {t0} to {t1}."
  k_a: "FTD as a trade, {idx}: with the skill's own FTD rule the test period had {events} FTDs detected and {n} trades.{notes} Win rate {win}, median trade {median}, mean {mean}, profit factor {pf}. {stopped} of the {n} trades ended at the stop, a close below the FTD-day low."
  k_b: "Exposure rule, {idx}: in the test period CAGR was {cagr} against {bh_cagr} for buy and hold. Max drawdown was {max_dd} against {bh_dd}. A benchmark holding the same average exposure {inv} every day, rest in cash, had CAGR {em_cagr} and max drawdown {em_dd}. The rule's max drawdown was {word} that benchmark."
  k_design: "Baseline in the design period, {idx}: the FTD rule made {n} trades, with a win rate of {win} and a median trade of {median}. The exposure rule's max drawdown was {dd}, {word} the {em_dd} of the benchmark holding the same average exposure every day. The share of falls of {thr} or more within {h} sessions was {p_el} after HIGH or SEVERE days and {p_no} after the other days, the first {dir} the second. Across the four risk levels the share {mono}."
  k_b_violation: "{idx}: the variant picked for B, {id}, earned a CAGR of {cagr} in the test period, {gap} points below the {bh_cagr} of buy and hold. It broke the condition used to pick it, that CAGR may not fall more than {tol} points below buy and hold."
  k_c: "Share of falls of {dd} or more within {h} sessions, {idx}: in the test period it followed {p_el} of elevated-risk days (HIGH or SEVERE; n={n_el}) and {p_no} of the other days (n={n_no}). The first is {dir} the second. Across the four risk levels the share {mono}."
  k_tally: "Of the {n} index-by-evaluation cases where the design period picked something other than the baseline, the pick beat the baseline on the test period in {better}. Better is judged on the metric the pick was selected for."
  k_tally_none: "In the design period the baseline was kept for every index, so there is no comparison with the baseline."
  m_split: "The periods were fixed in advance. The design period used to pick conditions is {d0} to {d1}. The test period used to check is {t0} to {t1}. The end of the test period is also a fixed date, not the latest session of the data. Sessions after {t1} are not part of the test period; they go only into the forward record tables."
  m_once: "Conditions are picked on design-period results only. Test-period results are computed once, for the baseline and the picked variant, and the conditions were not changed after seeing them. There are three exceptions. The tie rule was defined after the results had been seen. R2's test period had been seen in a preview before R2 was designed. Research R was designed after statistics over the whole of 2000 to 2026, which include the test period, had been looked at."
  m_index: "Each index is evaluated separately and never combined."
  m_pit: "Every signal uses only data up to that day."
  m_window: "Events whose forward window of {h} sessions runs past the end of the period are dropped."
  m_crit_a: "Pick rule for A: among variants with at least {n} trades, the highest median trade return."
  m_crit_b: "Pick rule for B: among variants whose CAGR is no more than {pp} points below buy and hold, the shallowest max drawdown."
  m_crit_c: "Pick rule for C: among definitions with at least {n} elevated days and at least {n} other days, the largest gap in the share of falls of {dd} or more within {h} sessions."
  m_fallback: "If no variant qualifies for an index, the baseline is kept."
  h_amend: "Post-hoc changes and freeze"
  m_tie: "Tie rule: when variants tie exactly on the design-period metric, the one with more design-period trades or observations comes first, then the one with simpler parameters closer to the baseline, and last the variant id."
  m_amend: "Post-hoc change ({date}): the tie rule was defined after the results had been seen. Before that, ties were broken by the string order of the variant id. A review found several variants tied exactly on the design-period median, so the rule above replaced it. Because the picked variants can change with it, it is recorded as a post-hoc change. The picks now in force follow the rule above."
  m_freeze: "The variant grid was registered on {date} and its sha256 {sha} is recorded. At publish time the grid in the current code is compared with this value, and publishing stops if they differ."
  tie_pick_a: "The amended tie rule changed the pick for A, {idx}. The earlier pick {before} had a design-period median of {bd_med}, and in the test period {b_n} trades, a median of {b_med} and a mean of {b_mean}. The pick now in force, {after}, has a design-period median of {ad_med}, and in the test period {a_n} trades, a median of {a_med} and a mean of {a_mean}."
  tie_pick_b: "The amended tie rule changed the pick for B, {idx}. The earlier pick {before} had a design-period max drawdown of {bd_dd}, and in the test period a CAGR of {b_cagr} and a max drawdown of {b_dd}. The pick now in force, {after}, has a design-period max drawdown of {ad_dd}, and in the test period a CAGR of {a_cagr} and a max drawdown of {a_dd}."
  tie_pick_c: "The amended tie rule changed the pick for C, {idx}. The earlier definition {before} had a design-period gap of {bd_sp} and {b_sp} in the test period. The definition now in force, {after}, has a design-period gap of {ad_sp} and {a_sp} in the test period."
  tie_tally_same: "The tally is the same before and after this change: of the {n} cases where the design period picked something other than the baseline, the pick beat the baseline on the test period in {better}."
  tie_tally_changed: "This change moved the number of picks that beat the baseline on the test period from {better_old} of {n_old} before to {better} of {n} after."
  tie_none: "The amended tie rule did not change any pick."
  variants_intro: "{n_total} variants were tried. FTD has {n_cfg} detector settings times the volume condition, giving {n_ftd} variants. DD has {n_sig} signal definitions times the exposure level, giving {n_dd} variants. The baseline is the skill's own definition."
  v_corr: "FTD: depth of the prior decline"
  v_gain: "FTD: minimum gain"
  v_vol: "FTD: require volume above the 50-day average"
  v_vol_vals: "no / yes"
  v_vol_base: "no"
  v_decline: "DD: decline threshold"
  v_dvol: "DD: volume condition"
  v_risk: "DD: risk reference"
  v_exp: "DD: exposure when risk is high"
  variants_note: "The FTD variants that require volume above average are a filter applied after detection. Building the condition into the detector can make a different day the FTD."
  v_codes: "Codes in the table: prev_day means volume above the previous day, avg50 above the 50-day average, both means both. skill_high means risk level HIGH or above and skill_severe means SEVERE only. The number in pctl is the top share of d25 within its own distribution over the previous {look} sessions. That distribution excludes the day itself, and no signal is given until {min_obs} sessions have accumulated. Ties count as at or above, so a day whose d25 value is shared by many earlier days is less likely to rank in the top."
  a_intro: "Buy at the close of the day the FTD is detected. Sell at the close if the close falls below the FTD-day low, otherwise after {h} sessions."
  b_intro: "On days at or above the reference risk level, cut exposure from the next session. Otherwise stay 100% invested. Cash earns 0%."
  c_intro: "For each day, count whether the close fell {dd} or more within the next {h} sessions, and compare the share by risk level. Elevated days means HIGH or SEVERE days under the baseline."
  b_em_note: "Cutting exposure by itself reduces the max drawdown. So whether the DD signal means anything shows up only against a benchmark with the same average exposure held constant every day. That benchmark is shown for reference and was not used to pick variants."
  a_sel: "The design-period winner {id} had a median trade of {d_med} in the design period against {d_base} for the baseline. In the test period it was {t_med}, {word} the baseline's {t_base}, on {n} test trades."
  b_sel: "The design-period winner {id} had a max drawdown of {d_dd} in the design period against {d_base} for the baseline. In the test period it was {t_dd}, {word} the baseline's {t_base}. CAGR was {t_cagr} against {t_base_cagr} for the baseline."
  c_sel: "The design-period winner {id} had a gap of {d_sp} in the design period against {d_base} for the baseline. In the test period it was {t_sp}, {word} the baseline's {t_base}."
  sel_same: "The design period kept the baseline {id} itself, so there is no other variant to compare."
  c_levels: "Shares by risk level under the baseline definition."
  blocks_intro: "Returns 20 and 60 sessions ahead are tabulated by active DD count and by risk level. Daily windows overlap, so non-overlapping samples and calendar-year medians are shown next to them. A calendar-year block is the median and quartiles of the per-year medians, and its n is the number of years. The period covered is the whole range {first} to {last}, which includes the test period."
  blocks_note: "The all-sessions columns use overlapping windows, so they hold less independent information than their counts suggest. Treat rows with small counts as indicative only."
  cy_bucket: "{idx}: the median return {h} sessions ahead by active DD count, in calendar-year blocks, is {listing}. The {hi} bucket is {word} the {lo} bucket. The middle 50% ranges of the two {overlap}."
  cy_risk: "{idx}: the median return {h} sessions ahead by risk level, in calendar-year blocks, is {listing}. {hi} is {word} {lo}. The middle 50% ranges of the two {overlap}."
  ftd_out_intro: "Returns measured from the close of the day the FTD was detected. Distribution over the whole period, separately per index."
  cv_multiple: "Multiple comparisons: {n_total} variants were tried (FTD {n_ftd}, DD {n_dd}) and the best was picked. Looking good in the design period is a result of picking, and it is not guaranteed to continue in the test period."
  cv_small_n: "Small samples: the picked FTD variant has as few as {n} trades in the test period for one index. One trade moves the numbers a lot."
  cv_small_n_none: "Small samples: FTD trades number only a few per year, so the numbers rest on few trades."
  cv_overlap: "Daily statistics use overlapping forward windows, so they hold less independent information than the all-sessions counts suggest."
  cv_trade_overlap: "Overlapping trades: of the {n} FTDs of {idx} in the test period, {k} have another FTD of the same index detected within {h} sessions before or after. Their holding periods overlap, so they could not all be held with one unit of capital."
  n_years: "{n} years"
  cv_price_index: "These are price indices without dividends. CAGR is lower than total return."
  cv_cash: "The exposure evaluation assumes 0% on cash. Interest during the reduced-exposure periods is not included."
  cv_volume: "The volume quality of the early years is unverified. FTD and DD depend on the volume change from the previous day, so early-year results could change. {n_issues} rows have the same volume as the previous day; they are only recorded."
  cv_one_path: "The test period is a single path, and the S&P 500 and Nasdaq cover the same market. The results for the two indices cannot be counted as two independent pieces of evidence."
  cv_not_ibd: "These are not official IBD signals. They follow the skill's definitions."
  f_variants: "all variants, design-period results"
  f_test: "baseline and picked variants, test-period results"
  f_selected: "periods, pick rules, picked variants"
  f_report: "the first research report; text in Japanese, column names in English"
  h_overlay: "R2: adding leverage after an FTD"
  ov_lead: "The question is whether holding the index at 100%, borrowing to raise the exposure when an FTD is detected, and going back to 100% when Distribution Days pile up, adds return over plain buy and hold."
  ov_disclaimer: "This is research, not a trading recommendation."
  ov_dividend: "The indices are price indices without dividends. The dividends of the levered part are missing too, so the benefit of leverage is understated somewhat."
  ov_m_variants: "{n} variants were tried and all are recorded. The exposure goes back to 100% once {ks} Distribution Days have been counted after the FTD day, with or without also going back when the FTD is invalidated (a close below the FTD day low), at an exposure of {levs}. The baseline is buy and hold at 100%."
  ov_m_split: "Variants are picked on the design period {d0} to {d1} only. The test period {t0} to {t1} was computed once, for buy and hold and for the picked variant. That test period had, however, been seen in a preview before the design."
  ov_m_criterion: "The pick rule was fixed before R2's own computations. The test period had been seen in a preview, though, so the test-period result is not a clean out-of-sample check. The rule: among the variants whose design-period max drawdown is not worse than that of buy and hold by more than {pp} percentage points, take the highest design-period CAGR. It does not require beating buy and hold on CAGR. Costs: {main}. If none qualifies, buy and hold is kept."
  ov_m_timing: "The FTD is acted on at the close of its detected_on day and the new exposure applies from the next session. Only Distribution Days known by the close of day t count at day t. A new FTD is ignored while levered. The exit happens at the close of the day the condition holds."
  ov_m_cost: "Borrow cost is charged on exposure minus 1 only. The main case is the FRED effective federal funds rate (DFF) plus {spread} a year. FRED publishes each day's value on the next business day, so the rate used is the latest observation dated on or before the session before the previous one, a value published by the previous close. It is accrued per calendar day over 365, with the latest value carried over days without one. For comparison, fixed rates of {fixed} a year are also computed."
  ov_m_margin: "Margin stress is a placeholder, not a broker rule. A day counts when equity divided by position value falls below {ratio} on a position that is not rebalanced inside an episode."
  ov_m_tie: "Tie rule: if the design-period CAGR ties exactly, the variant with lower leverage comes first, then the smaller k, then the one that also exits on invalidation. This was defined after the results had been seen and is a post-hoc change."
  ov_m_em: "The same-exposure benchmark holds the variant's average exposure constant every day over the same period with the same borrow cost. It shows whether the timing means anything."
  ov_none: "The R2 files were not generated in this run."
  ov_sel_fallback: "{idx}: no variant met the rule in the design period, so buy and hold was kept and there is nothing to compare."
  ov_sel: "{idx}: picked {id} (k={k}, go back on invalidation: {inv}, exposure {lev}). {nq} of {nc} variants met the drawdown rule in the design period."
  ov_k: "{idx}: in the test period the picked variant earned a CAGR of {cagr}, {w_bh} the {bh_cagr} of buy and hold and {w_em} the {em_cagr} of the same average exposure held every day. Its max drawdown was {dd}, {w_dd} the {bh_dd} of buy and hold. It held more than 100% on {lev} of the days in {ep} episodes. The worst fall of equity while levered was {wl}, and margin stress days numbered {ms}."
  ov_k_same: "{idx}: the picked variant is buy and hold, so there is nothing to compare."
  ov_h_main: "Main case: {label}"
  ov_h_sens: "Borrow cost sensitivity, test period"
  ov_sens_note: "Same picked variant, only the borrow cost changes. Variants were not re-picked."
  ov_h_cv: "R2 caveats"
  ov_cv_pick: "{n} variants were tried and one was picked per index, so the design period flatters it. The test period is one path, and both indices cover the same market."
  ov_cv_margin: "The margin check uses a placeholder requirement of {ratio}. Real brokers can change requirements and close positions on their own, which this model does not include."
  ov_cv_cost: "Only the borrow cost is charged. Trading costs and taxes are not included, and cash earns 0%."
