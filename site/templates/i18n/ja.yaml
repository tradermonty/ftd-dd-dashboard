research:
  title: "研究: FTD と DD を数字で確かめる"
  lead: "FTD と ディストリビューションデーは、相場の底や天井の目安として語られます。ここでは、スキルの定義をそのまま基準に置き、条件を変えた案と比べて、数字の上で何が言えるかを調べました。"
  caveat_short: "多くの案を試した結果なので、選ばれた案が良く見えるのは当然です。件数が少なく、価格指数は配当を含まず、投資比率の比較では現金の利回りを0としています。注意点の節を先に読んでください。"
  h_conclusions: "要点"
  conclusions_note: "検証期間は、条件を選ぶときには見ていない期間です。ただし例外が三つあります。一つ目は同点の決め方で、検証期間の結果を見たあとに定めました。二つ目は R2 で、設計の前に、検証期間を含む期間で下見をしています。三つ目は R で、設計の前に、検証期間を含む全期間の統計を見て背景の節を書いています。詳しくは「事後の変更と固定」の節と、R と R2 の注意の囲みに書いています。基準案の設計期間の結果は、選ぶときの候補に入っていたので、選択にまったく使われていない数字ではありません。基準案が選ばれた案と違うのは、結果から選んだものではなく、スキル自身の定義だという点です。"
  h_method: "検証の決まり"
  h_variants: "試した案"
  h_a: "A. FTD を売買として見る"
  h_b: "B. DD の危険度で投資比率を変える"
  h_c: "C. 危険度ごとの大きな下落の割合"
  h_blocks: "DD の数と危険度ごとの、その後の騰落"
  h_blocks_dd: "有効な DD の数別"
  h_blocks_risk: "危険度別"
  h_ftd_out: "FTD のその後の騰落"
  h_caveats: "注意点"
  h_files: "元の数字"
  k_variants: "試した案は全部で{n_total}通りです。FTD が{n_ftd}案、DD が{n_dd}案です。すべて設計期間 {d0} から {d1} で採点し、基準案と選ばれた案だけを、検証期間 {t0} から {t1} で一度だけ採点しました。"
  k_a: "{idx}の FTD 売買: スキルの定義どおりの FTD で、検証期間に検出された FTD は{events}件、取引は{n}回でした。{notes}勝率は{win}、1回あたり損益の中央値は{median}、平均は{mean}、プロフィットファクターは{pf}です。{n}回のうち{stopped}回は、終値が FTD 当日の安値を割り込んで損切りになりました。"
  k_b: "{idx}の投資比率ルール: 検証期間の年率は{cagr}で、買って持ち続けた場合は{bh_cagr}でした。最大下落は{max_dd}で、持ち続けた場合は{bh_dd}です。平均投資比率{inv}を毎日一定に保ち、残りを現金にした比較対象は、年率{em_cagr}、最大下落{em_dd}でした。ルールの最大下落は、この比較対象{word}。"
  k_design: "設計期間の基準案、{idx}: FTD の取引は{n}回で、勝率は{win}、損益の中央値は{median}でした。投資比率ルールの最大下落は{dd}で、同じ平均投資比率を保った比較対象の{em_dd}{word}。{h}セッション以内に{thr}以上下がった割合は、危険度が高いか深刻の日の後で{p_el}、それ以外の日の後で{p_no}で、前者は後者{dir}。危険度の4段階で見ると、この割合は{mono}。"
  k_b_violation: "{idx}: B で選ばれた案 {id} は、検証期間の年率が{cagr}で、持ち続けた場合の{bh_cagr}より{gap}ポイント低くなりました。選ぶときに課した、年率が持ち続けた場合より{tol}ポイントを超えて下がらないという条件を、検証期間では破っています。"
  k_c: "{idx}で{h}セッション以内に{dd}以上下がった割合: 検証期間では、危険度が高いか深刻の日の後で{p_el}（n={n_el}）、それ以外の日の後で{p_no}（n={n_no}）でした。前者は後者{dir}。危険度の4段階で見ると、この割合は{mono}。"
  k_tally: "設計期間に基準案とは別の案が選ばれた{n}件のうち、検証期間でも基準案より良かったのは{better}件でした。良し悪しは、その案を選んだ指標で比べています。"
  k_tally_none: "設計期間では、どの指数でも基準案が選ばれたため、基準案との比較はありません。"
  m_split: "期間は先に固定しました。条件を選ぶ設計期間は {d0} から {d1}、確かめる検証期間は {t0} から {t1} です。検証期間の終わりも日付で固定していて、データの最新日ではありません。{t1} より後のセッションは検証期間に入れず、今後の記録の表にだけ入れます。"
  m_once: "条件は設計期間の成績だけで選びます。検証期間の成績は、基準案と選ばれた案について一度だけ計算し、それを見てから条件を変えていません。ただし例外が三つあります。同点の決め方は、結果を見たあとに定めました。R2 は、設計の前に下見で検証期間を見ていました。R は、設計の前に、検証期間を含む全期間の統計を見ていました。"
  m_index: "指数ごとに別々に評価し、合算していません。"
  m_pit: "どのシグナルも、その日までのデータだけで決めています。"
  m_window: "先の{h}セッションの窓が期間の終わりを超えるイベントは、評価から外しています。"
  m_crit_a: "A の選び方: 取引数が{n}回以上の案のうち、1回あたり損益の中央値が最も高いもの。"
  m_crit_b: "B の選び方: 年率が持ち続けた場合より{pp}ポイントを超えて下がらない案のうち、最大下落が最も浅いもの。"
  m_crit_c: "C の選び方: 危険度が基準以上の日と、それ以外の日が、それぞれ{n}日以上ある定義のうち、{h}セッション以内に{dd}以上下がる割合の差が最も大きいもの。"
  m_fallback: "条件を満たす案がない指数では、基準案をそのまま使います。"
  h_amend: "事後の変更と固定"
  m_tie: "同点の決め方: 設計期間の指標がまったく同じ案が並んだときは、設計期間の取引や観測が多い案を先にします。次に、パラメータが単純で基準案に近い案を先にし、最後は案の ID の順です。"
  m_amend: "事後の変更（{date}）: 同点の決め方は、結果を見たあとに定めました。それまでは、同点のとき案の ID を文字列として並べた順で選んでいました。レビューで、設計期間の中央値がまったく同じ案が複数あることが分かったため、上の決め方に改めています。選ばれた案がこの変更で変わりうるので、事後の変更として記録します。今の選択は、上の決め方によるものです。"
  m_freeze: "案の格子は {date} に登録し、sha256 {sha} を記録しています。公開のときに現在のコードの格子とこの値を照合し、違えば公開を止めます。"
  tie_pick_a: "同点の決め方の変更で選ばれた案が変わったのは、評価 A の{idx}です。以前の案 {before} は、設計期間の中央値が{bd_med}で、検証期間では取引{b_n}回、中央値{b_med}、平均{b_mean}でした。今の案 {after} は、設計期間の中央値が{ad_med}で、検証期間では取引{a_n}回、中央値{a_med}、平均{a_mean}です。"
  tie_pick_b: "同点の決め方の変更で選ばれた案が変わったのは、B の{idx}です。以前の案 {before} は、設計期間の最大下落が{bd_dd}で、検証期間では年率{b_cagr}、最大下落{b_dd}でした。今の案 {after} は、設計期間の最大下落が{ad_dd}で、検証期間では年率{a_cagr}、最大下落{a_dd}です。"
  tie_pick_c: "同点の決め方の変更で選ばれた定義が変わったのは、C の{idx}です。以前の定義 {before} は、設計期間の差が{bd_sp}で、検証期間では{b_sp}でした。今の定義 {after} は、設計期間の差が{ad_sp}で、検証期間では{a_sp}です。"
  tie_tally_same: "この変更の前も後も、設計期間に基準案とは別の案が選ばれた{n}件のうち、検証期間で基準案より良かったのは{better}件で、集計は変わりません。"
  tie_tally_changed: "この変更で、検証期間に基準案より良かった件数は、変更前の{n_old}件中{better_old}件から、変更後の{n}件中{better}件に変わりました。"
  tie_none: "同点の決め方を変えても、選ばれた案が変わった例はありませんでした。"
  variants_intro: "試した案は{n_total}通りです。FTD は{n_cfg}通りの判定条件に出来高の条件を掛けた{n_ftd}案、DD は{n_sig}通りのシグナル定義に投資比率を掛けた{n_dd}案です。基準案はスキルそのままの定義です。"
  v_corr: "FTD: 押し目の深さ"
  v_gain: "FTD: 最低の上昇率"
  v_vol: "FTD: 出来高が50日平均を超えることを必須にする"
  v_vol_vals: "しない / する"
  v_vol_base: "しない"
  v_decline: "DD: 下落率のしきい値"
  v_dvol: "DD: 出来高の条件"
  v_risk: "DD: 危険度の基準"
  v_exp: "DD: 危険度が高いときの投資比率"
  variants_note: "出来高を必須にする FTD の案は、検出したあとの絞り込みです。検出器の中に組み込んだ場合とは、別の日が FTD になることがあります。"
  v_codes: "表の記号: prev_day は出来高が前日より多い、avg50 は50日平均より多い、both は両方。skill_high は危険度が高い以上、skill_severe は深刻のみ。pctl の数字は、d25 が直近{look}セッションの分布の上位何％に入るかです。この分布にその日は含まれず、{min_obs}セッション分たまるまではシグナルを出しません。同じ値は「以上」として数えるので、同じ値が多い日は上位に入りにくくなります。"
  a_intro: "FTD が見つかった日の引けで買い、終値が FTD 当日の安値を割ったらその日の引けで売り、割らなければ{h}セッション後に売ります。"
  b_intro: "危険度が基準以上の日は、翌日から投資比率を下げ、それ以外は100%にします。現金の利回りは0です。"
  c_intro: "各日の後{h}セッション以内に、終値が{dd}以上下がったかを数え、危険度ごとにその割合を比べます。「基準以上の日」は、基準案では危険度が高いか深刻の日のことです。"
  b_em_note: "投資比率を下げるだけでも最大下落は小さくなります。だから、DD のシグナルに意味があるかは、同じ平均投資比率を毎日一定に保った比較対象と並べて初めて分かります。この比較対象は参考で、案の選択には使っていません。"
  a_sel: "設計期間で最良だった案 {id} は、損益の中央値が設計期間で{d_med}、基準案は{d_base}でした。検証期間では{t_med}で、基準案の{t_base}{word}。検証期間の取引は{n}回です。"
  b_sel: "設計期間で最良だった案 {id} は、最大下落が設計期間で{d_dd}、基準案は{d_base}でした。検証期間では{t_dd}で、基準案の{t_base}{word}。年率は{t_cagr}で、基準案は{t_base_cagr}です。"
  c_sel: "設計期間で最良だった定義 {id} は、割合の差が設計期間で{d_sp}、基準は{d_base}でした。検証期間では{t_sp}で、基準の{t_base}{word}。"
  sel_same: "設計期間の結果、基準案 {id} がそのまま選ばれました。比べる案はありません。"
  c_levels: "基準の定義での、危険度ごとの割合です。"
  blocks_intro: "有効な DD の数や危険度ごとに、その後20日と60日の騰落率を集計しました。日ごとの窓は重なるので、重ならない標本と、暦年ごとの中央値も並べます。暦年ブロックは、各年の中央値のさらに中央値と四分位で、その件数は年数です。集計の期間は {first} から {last} までの全期間で、検証期間を含みます。"
  blocks_note: "全営業日の列は窓が重なるため、見かけより独立した情報は少なくなります。件数が小さい列は参考にとどめてください。"
